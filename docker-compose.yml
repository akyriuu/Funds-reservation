services:
  postgres:
    image: postgres:17-alpine
    container_name: hold-system-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hold
      POSTGRES_PASSWORD: hold
      POSTGRES_DB: hold_system
    ports:
      - '4432:5432'
    volumes:
      - hold-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hold -d hold_system']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hold-pgdata: